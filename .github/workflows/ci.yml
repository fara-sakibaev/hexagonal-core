name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, simplexml
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer package
        run: composer validate --no-check-publish

      - name: Check code style
        run: composer cs:check

      - name: Run PHPStan
        run: composer analyse:phpstan

      - name: Run Psalm
        run: composer analyse:psalm

      - name: Test outbox
        run: composer test:outbox

      - name: Test setup
        run: composer test:setup

      - name: Test validation
        run: composer test:validation

      - name: Test static analysis rules
        run: composer test:analysis

      - name: Install Symfony validator integration dependencies
        working-directory: integrations/symfony-validator
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Test Symfony validator integration
        working-directory: integrations/symfony-validator
        run: composer test
